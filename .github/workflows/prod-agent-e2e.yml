name: Prod Agent E2E (AWS-only)

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Backend to AWS"]
    types: [completed]
    branches: [main]

jobs:
  prod-agent-e2e:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger
          sudo apt-get update -y
          sudo apt-get install -y qemu-kvm || true
          ls -l /dev/kvm || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools" >> "$GITHUB_PATH"
          yes | ${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          ${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Download published APK (apk-165+)
        run: |
          mkdir -p /tmp/apk
          curl -fsSL -L -o /tmp/apk/mobilerun.apk \
            https://github.com/MacAndersonUche/mobilerun/releases/latest/download/mobilerun.apk
          ls -la /tmp/apk/mobilerun.apk

      - name: Run emulator + prod AWS-only agent E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          emulator-boot-timeout: 900
          script: |
            export APK_PATH=/tmp/apk/mobilerun.apk
            export ARTIFACTS_DIR=$GITHUB_WORKSPACE/prod-agent-artifacts
            export API_URL=https://68tgk4z5n6.execute-api.eu-west-2.amazonaws.com
            export WS_URL=wss://sv7144gijj.execute-api.eu-west-2.amazonaws.com/prod
            chmod +x scripts/prod_emu_agent_e2e.sh
            bash scripts/prod_emu_agent_e2e.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-agent-e2e-${{ github.run_id }}
          path: prod-agent-artifacts/
          if-no-files-found: warn
