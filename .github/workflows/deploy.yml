name: Deploy Backend to AWS

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'infra/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skip if AWS secrets aren't configured
    if: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
    
    permissions:
      contents: read
      id-token: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install CDK dependencies
        run: |
          cd infra
          npm ci
      
      - name: Build CDK
        run: |
          cd infra
          npm run build
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2
      
      - name: CDK Bootstrap
        run: |
          cd infra
          npx cdk bootstrap || true
      
      - name: CDK Deploy
        run: |
          cd infra
          # Deploy with Lambda backend (default, near-zero cost)
          # EC2 is opt-in only: add -c enableEC2=true to enable (costs ~$8/month)
          npx cdk deploy --require-approval never
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || '' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || '' }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || '' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || '' }}
      
      - name: Get API URL
        id: api_url
        run: |
          cd infra
          API_URL=$(npx cdk deploy --require-approval never --outputs-file outputs.json 2>&1 | grep -o 'https://[^"]*' | head -1)
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          echo "::notice title=API Deployed::Backend API URL: $API_URL"
      
      - name: Summary
        run: |
          echo "## ✅ Backend Deployed to AWS (Near-Zero Cost)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Region:** eu-west-2" >> $GITHUB_STEP_SUMMARY
          echo "**Backend:** Lambda (pay-per-use)" >> $GITHUB_STEP_SUMMARY
          echo "**API URL:** ${{ steps.api_url.outputs.api_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Cost-Optimized Stack:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Lambda (free tier: 1M requests/month)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ DynamoDB on-demand (free tier: 25GB, 25 WCU/RCU)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ S3 with 7-day expiration (free tier: 5GB)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ API Gateway (free tier: 1M calls/month)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Budget alert at \$5/month to macandersonuche@yahoo.com" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ CloudWatch logs: 7-day retention" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Expected monthly cost:** \$0-1 for light use (within free tier)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Lambda limitation:** 15-minute timeout per task" >> $GITHUB_STEP_SUMMARY
          echo "For longer tasks, use local PC: \`mobilerun serve\`" >> $GITHUB_STEP_SUMMARY
