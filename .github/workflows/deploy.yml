name: Deploy Backend to AWS

on:
  push:
    branches: [main, 'cursor/**']
    paths:
      - 'backend/**'
      - 'infra/**'
      - 'mobilerun/connectivity/**'
      - 'mobilerun/dating/**'
      - 'mobilerun/needs_you/**'
      - 'mobilerun/selectors/**'
      - 'mobilerun/safety/**'
      - 'mobilerun/social/**'
      - 'mobilerun/agent/humanizer.py'
      - 'config/dating_openers.json'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'infra/**'
      - 'mobilerun/connectivity/**'
      - 'mobilerun/dating/**'
      - 'mobilerun/needs_you/**'
      - 'mobilerun/selectors/**'
      - 'mobilerun/safety/**'
      - 'mobilerun/social/**'
      - 'mobilerun/agent/humanizer.py'
      - 'config/dating_openers.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy (branch/SHA). Leave empty for current branch/main.'
        required: false
        default: ''
      skip_smoke:
        description: 'Skip post-deploy smoke tests'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: mobilerun-aws-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Secrets presence: empty-string compare is unreliable; attempt deploy and fail clearly
    outputs:
      api_url: ${{ steps.outs.outputs.api_url }}
      ws_url: ${{ steps.outs.outputs.ws_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Require AWS secrets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::error::AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY not set"
            exit 1
          fi
          if [ -z "$JWT_SECRET" ]; then
            echo "::warning::JWT_SECRET empty — stack will use placeholder (set secret for prod)"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CDK dependencies
        working-directory: infra
        run: npm ci

      - name: Build CDK
        working-directory: infra
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      - name: CDK Bootstrap
        working-directory: infra
        run: npx cdk bootstrap aws://$(aws sts get-caller-identity --query Account --output text)/eu-west-2 || true

      - name: Build Lambda asset (binary wheels)
        run: |
          set -euo pipefail
          rm -rf /tmp/lambda-asset
          mkdir -p /tmp/lambda-asset
          python3 -m pip install -r backend/requirements.txt -t /tmp/lambda-asset
          # Package layout: /var/task/backend/*.py + /var/task/mobilerun/...
          # Dating UI + step worker need needs_you/selectors/humanizer/safety/social.
          # Do NOT copy full mobilerun/agent (pulls llama_index); only humanizer.py.
          mkdir -p /tmp/lambda-asset/backend \
            /tmp/lambda-asset/mobilerun/dating \
            /tmp/lambda-asset/mobilerun/connectivity \
            /tmp/lambda-asset/mobilerun/server \
            /tmp/lambda-asset/mobilerun/needs_you \
            /tmp/lambda-asset/mobilerun/selectors \
            /tmp/lambda-asset/mobilerun/safety \
            /tmp/lambda-asset/mobilerun/social \
            /tmp/lambda-asset/mobilerun/agent \
            /tmp/lambda-asset/config
          cp backend/*.py /tmp/lambda-asset/backend/
          printf '' > /tmp/lambda-asset/backend/__init__.py
          cp mobilerun/dating/*.py /tmp/lambda-asset/mobilerun/dating/
          printf '' > /tmp/lambda-asset/mobilerun/dating/__init__.py
          cp mobilerun/connectivity/*.py /tmp/lambda-asset/mobilerun/connectivity/
          # Stub package init so importlib.metadata.version("mobilerun") is not required in Lambda
          printf '%s\n' '__version__ = "0.0.0"' > /tmp/lambda-asset/mobilerun/__init__.py
          printf '' > /tmp/lambda-asset/mobilerun/connectivity/__init__.py
          cp mobilerun/needs_you/*.py /tmp/lambda-asset/mobilerun/needs_you/
          printf '' > /tmp/lambda-asset/mobilerun/needs_you/__init__.py
          # Re-copy real needs_you __init__ if present
          [ -f mobilerun/needs_you/__init__.py ] && cp mobilerun/needs_you/__init__.py /tmp/lambda-asset/mobilerun/needs_you/
          cp mobilerun/selectors/*.py /tmp/lambda-asset/mobilerun/selectors/
          [ -f mobilerun/selectors/__init__.py ] && cp mobilerun/selectors/__init__.py /tmp/lambda-asset/mobilerun/selectors/
          cp mobilerun/safety/*.py /tmp/lambda-asset/mobilerun/safety/
          [ -f mobilerun/safety/__init__.py ] && cp mobilerun/safety/__init__.py /tmp/lambda-asset/mobilerun/safety/
          cp mobilerun/social/*.py /tmp/lambda-asset/mobilerun/social/
          [ -f mobilerun/social/__init__.py ] && cp mobilerun/social/__init__.py /tmp/lambda-asset/mobilerun/social/
          # Lightweight humanizer only (no agent package side effects)
          cp mobilerun/agent/humanizer.py /tmp/lambda-asset/mobilerun/agent/
          printf '%s\n' '"""Lambda-safe agent package (humanizer only)."""' > /tmp/lambda-asset/mobilerun/agent/__init__.py
          if [ -f config/dating_openers.json ]; then
            cp config/dating_openers.json /tmp/lambda-asset/config/
          fi
          # mdns helper only (avoid server/__init__ importing local serve)
          if [ -f mobilerun/server/mdns.py ]; then
            printf '' > /tmp/lambda-asset/mobilerun/server/__init__.py
            cp mobilerun/server/mdns.py /tmp/lambda-asset/mobilerun/server/
          fi
          # Verify imports from a clean cwd so checkout mobilerun/ is not preferred.
          # Single-line -c keeps the run:| YAML block valid (no column-0 lines).
          (cd /tmp && PYTHONPATH=/tmp/lambda-asset python3 -c 'from backend.main import handler; from backend.ws_handler import handler as w; from backend.step_worker import handler as s; from mobilerun.connectivity.endpoints import build_pairing_url; from mobilerun.agent.humanizer import describe_presets; from mobilerun.needs_you.queue import NeedsYouQueue; from mobilerun.selectors.cache import SelectorCache; from mobilerun.safety.runtime import get_safety_state; print("imports ok", handler, w, s, describe_presets)')
          ls /tmp/lambda-asset/backend | head
          ls /tmp/lambda-asset/mobilerun | head

      - name: CDK Deploy (Lambda + HTTP API + WebSocket + EventBridge)
        working-directory: infra
        run: |
          npx cdk deploy MobilerunStack --require-approval never --outputs-file cdk-outputs.json
          cat cdk-outputs.json
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          # Prefer OpenAI while Gemini quota is exhausted (429)
          PREFER_OPENAI: 'true'
          LAMBDA_ASSET_DIR: /tmp/lambda-asset
          SKIP_BUNDLING: '1'

      - name: Parse outputs
        id: outs
        working-directory: infra
        run: |
          API_URL=$(python3 -c "import json;d=json.load(open('cdk-outputs.json'));k=list(d)[0];print(d[k].get('ApiUrl',''))")
          WS_URL=$(python3 -c "import json;d=json.load(open('cdk-outputs.json'));k=list(d)[0];print(d[k].get('WebSocketUrl',''))")
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"
          echo "ws_url=$WS_URL" >> "$GITHUB_OUTPUT"
          echo "API_URL=$API_URL" >> "$GITHUB_ENV"
          echo "WS_URL=$WS_URL" >> "$GITHUB_ENV"
          echo "::notice title=API Deployed::HTTP=$API_URL WS=$WS_URL"

      - name: Point Lambda BACKEND_URL at HTTP API
        run: |
          set -euo pipefail
          for fn in $(aws lambda list-functions --query "Functions[?contains(FunctionName,'HttpFunction') || contains(FunctionName,'Mobilerun')].FunctionName" --output text); do
            echo "Updating $fn BACKEND_URL"
            # Wait out in-progress updates from overlapping deploys
            aws lambda wait function-updated --function-name "$fn" || true
            CFG=$(aws lambda get-function-configuration --function-name "$fn" --query 'Environment.Variables' --output json)
            echo "$CFG" | python3 -c "import json,sys,os; d=json.load(sys.stdin) or {}; d['BACKEND_URL']=os.environ['API_URL']; d['API_URL']=os.environ['API_URL']; print(json.dumps({'Variables':d}))" > /tmp/env.json
            aws lambda update-function-configuration --function-name "$fn" --environment file:///tmp/env.json >/dev/null || true
            aws lambda wait function-updated --function-name "$fn" || true
          done

      - name: Smoke test
        if: ${{ github.event.inputs.skip_smoke != 'true' }}
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          set -euo pipefail
          echo "Health..."
          curl -sfS "$API_URL/api/health" | tee /tmp/health.json
          python3 -c "import json; d=json.load(open('/tmp/health.json')); assert d.get('status')=='ok', d"

          echo "Auth rejection (no token)..."
          code=$(curl -s -o /tmp/unauth.json -w '%{http_code}' "$API_URL/api/devices")
          echo "HTTP $code"
          test "$code" = "401" -o "$code" = "403"

          echo "Purge test/CI devices from Mac + admin Dynamo lists (keep real devices only if any)..."
          pip install -q boto3
          python3 <<'PY'
          import time
          import boto3

          table_name = "mobilerun-settings"
          tbl = boto3.resource("dynamodb").Table(table_name)
          owners = [
              "macandersonuche@yahoo.com",
              "admin@local",
              "admin",
              "ci-e2e@local",
              "ci-e2e",
          ]

          def looks_like_test(name: str, did: str) -> bool:
              blob = f"{name} {did}".lower()
              return any(
                  t in blob
                  for t in (
                      "smoke",
                      "emu",
                      "emulator",
                      "ci-",
                      "ci_",
                      "test",
                      "pixel_ci",
                      "device_ci",
                      "github",
                      "runner",
                      "verify-phone",
                      "smoke-phone",
                  )
              )

          for owner in owners:
              key = f"user:{owner}:devices"
              item = tbl.get_item(Key={"key": key}).get("Item") or {}
              data = item.get("data") or {}
              devices = dict(data.get("devices") or {})
              if not devices:
                  print(f"{owner}: empty")
                  continue
              keep = {}
              removed = []
              for did, row in devices.items():
                  row = dict(row or {})
                  name = str(row.get("name") or row.get("device_name") or "")
                  did_s = str(did)
                  # Mac Cognito: keep real phones; admin/ci: clear all
                  if owner.startswith("macanderson") and not looks_like_test(name, did_s):
                      keep[did_s] = row
                  else:
                      removed.append(did_s)
              print(f"{owner}: had={len(devices)} remove={len(removed)} keep={len(keep)}")
              tbl.put_item(
                  Item={
                      "key": key,
                      "user_id": owner,
                      "name": "devices",
                      "data": {"devices": keep},
                      "updated_at": int(time.time()),
                  }
              )
          print("Purge OK")
          PY

          echo "Login (ci-e2e) + device-code + QR pair create + APK download QR..."
          # Dedicated CI user so smoke devices never land on Mac/admin
          TOKEN=$(curl -sfS -X POST "$API_URL/api/auth/login" \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci-e2e","password":"admin"}' | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          curl -sfS "$API_URL/api/auth/me" -H "Authorization: Bearer $TOKEN" | tee /tmp/me.json
          python3 -c "import json; d=json.load(open('/tmp/me.json')); assert d.get('authenticated') is True, d; assert 'ci-e2e' in (d.get('email') or '')"
          echo "LLM key presence + real provider probe..."
          curl -sfS "$API_URL/api/config/llm" -H "Authorization: Bearer $TOKEN" | tee /tmp/llm.json
          python3 -c "import json; d=json.load(open('/tmp/llm.json')); assert d.get('keys_present',{}).get('openai') is True, ('OPENAI_API_KEY missing on Lambda', d)"
          # Probe: do not use curl -f — Gemini-only timeouts must not mask OpenAI success
          code=$(curl -sS -o /tmp/llm-probe.json -w '%{http_code}' -X POST "$API_URL/api/config/llm/probe" \
            -H "Authorization: Bearer $TOKEN")
          echo "probe HTTP $code"
          head -c 1200 /tmp/llm-probe.json; echo
          python3 -c "import json; d=json.load(open('/tmp/llm-probe.json')); print('llm_probe', d); assert d.get('keys_present',{}).get('openai') is True, d; assert (d.get('openai') or {}).get('ok') is True and (d.get('openai') or {}).get('http_status')==200, ('OpenAI probe must return 200', d); print('OPENAI_present=True openai_ok=True openai_http=200 model=', (d.get('openai') or {}).get('model'))"
          # Legacy device-code (still supported)
          curl -sfS -X POST "$API_URL/api/auth/device/code" \
            -H 'Content-Type: application/json' \
            -d '{"device_name":"smoke-device","platform":"android"}' | tee /tmp/dcode.json
          python3 -c "import json; d=json.load(open('/tmp/dcode.json')); assert d.get('user_code') and d.get('device_code'), d"
          # Short-code QR pairing (primary APK path)
          curl -sfS -X POST "$API_URL/api/auth/pair/create" \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"device_name":"smoke-phone","platform":"android"}' | tee /tmp/pair.json
          python3 -c "import json; d=json.load(open('/tmp/pair.json')); assert d.get('token') and d.get('code') and d.get('pairing_url') and d.get('qr_code'); assert '/p/' in (d.get('short_link') or d.get('https_link') or ''), d; assert 6 <= len(d['code']) <= 8, d"
          curl -sfS -X POST "$API_URL/api/auth/pair/claim" \
            -H 'Content-Type: application/json' \
            -d "{\"token\":\"$(python3 -c "import json; print(json.load(open('/tmp/pair.json'))['code'])")\",\"device_name\":\"smoke-phone\",\"device_id\":\"device_ci_smoke\"}" | tee /tmp/claim.json
          python3 -c "import json; d=json.load(open('/tmp/claim.json')); assert d.get('session_token') and d.get('device_id'), d"
          # Cleanup — never leave CI devices on the account (including any
          # concurrent real-APK/emulator sessions under ci-e2e).
          DID=$(python3 -c "import json; print(json.load(open('/tmp/claim.json'))['device_id'])")
          curl -sfS -X DELETE "$API_URL/api/devices/$DID" -H "Authorization: Bearer $TOKEN" || true
          curl -sfS "$API_URL/api/devices" -H "Authorization: Bearer $TOKEN" | tee /tmp/ci_devices.json
          API_URL="$API_URL" TOKEN="$TOKEN" python3 scripts/smoke_cleanup_ci_devices.py /tmp/ci_devices.json
          curl -sfS "$API_URL/api/devices" -H "Authorization: Bearer $TOKEN" | tee /tmp/ci_devices.json
          # Smoke device must be gone; concurrent live emulator sessions under ci-e2e may remain
          python3 -c "import json,os; d=json.load(open('/tmp/ci_devices.json')); did=os.environ.get('DID') or '''$DID'''; assert not any((x.get('device_id')==did) for x in d), d; print('smoke_device_removed remaining', len(d))"
          # /health alias
          curl -sfS "$API_URL/health" | tee /tmp/health_alias.json
          python3 -c "import json; d=json.load(open('/tmp/health_alias.json')); assert d.get('status')=='ok', d"
          curl -sfS "$API_URL/api/releases/latest" | tee /tmp/apk.json
          python3 -c "import json; d=json.load(open('/tmp/apk.json')); assert d.get('apk_url') and d.get('qr_code'), d"
          echo "Cloud-only short-code claim (no LAN, ≤2s dead-LAN timeout)..."
          python3 scripts/verify_prod_cloud_only_pair.py "$API_URL"
          echo "Dating + mode + selectors (must be 200 on Lambda)..."
          for path in /api/dating/status /api/dating/review-queue /api/dating/openers /api/selectors/status /api/mode /api/humanizer; do
            code=$(curl -sS -o /tmp/dating_smoke.json -w '%{http_code}' \
              -H "Authorization: Bearer $TOKEN" "$API_URL$path")
            echo "HTTP $code $path"
            if [ "$code" != "200" ]; then
              echo "BODY:"; head -c 800 /tmp/dating_smoke.json; echo
              exit 1
            fi
          done
          echo "Smoke OK"

      - name: Summary
        run: |
          {
            echo "## Backend deployed (eu-west-2, near-zero cost)"
            echo ""
            echo "- **HTTP API:** \`$API_URL\`"
            echo "- **WebSocket API:** \`$WS_URL\`"
            echo "- Lambda + HTTP API + WebSocket API + on-demand DynamoDB + S3 (7d)"
            echo "- EventBridge 1-min ticks for step-driven dating/agent jobs"
            echo "- EC2 off · no NAT/ALB/RDS · \$5 budget alert"
            echo "- **Est. cost:** \$0–1/mo light use (free tier); alert at \$5"
            echo ""
            echo "Set Netlify env \`VITE_API_URL\` / \`VITE_BACKEND_URL\` to the HTTP API URL."
          } >> "$GITHUB_STEP_SUMMARY"
