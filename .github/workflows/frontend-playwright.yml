name: Frontend Playwright smoke

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-playwright.yml'
  push:
    branches: [main, 'cursor/**']
    paths:
      - 'frontend/**'

jobs:
  playwright:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: docs/ui-screenshots/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-ui-screenshots
          path: |
            docs/ui-screenshots/s21-*.png
            docs/ui-screenshots/mobile-*.png
          if-no-files-found: ignore
