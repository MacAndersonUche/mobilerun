name: Build and Release Android APK

on:
  push:
    branches: [ main, cursor/** ]
  pull_request:
    branches: [ main ]

jobs:
  android-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      
      - name: Build Release APK
        run: |
          cd android-app
          chmod +x gradlew || true
          # IME Samsung fix branch publishes as fixed apk-386 (not run_number)
          if [ "${{ github.ref }}" = "refs/heads/cursor/ime-samsung-subtype-df3e" ]; then
            VC=386
            VN=1.0.386
          else
            # Phone has 489 installed — never ship ≤489. Floor at 500.
            RN="${{ github.run_number }}"
            if [ "$RN" -lt 500 ]; then VC=500; else VC="$RN"; fi
            VN="1.0.$VC"
          fi
          echo "Building VERSION_CODE=$VC VERSION_NAME=$VN"
          echo "VC=$VC" >> "$GITHUB_ENV"
          ./gradlew assembleRelease \
            --no-daemon \
            -PVERSION_CODE="$VC" \
            -PVERSION_NAME="$VN"

      - name: Verify package id, versionCode, signing fingerprint
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq aapt >/dev/null
          APK=$(ls android-app/build/outputs/apk/release/*.apk | head -1)
          echo "APK=$APK"
          # Phone has 489 — min 490. Non-IME builds also floor at 500 in the build step.
          MIN_VC=490
          if [ "${{ github.ref }}" = "refs/heads/cursor/ime-samsung-subtype-df3e" ]; then
            MIN_VC=386
          fi
          python3 scripts/verify_apk_upgrade.py "$APK" android-app/debug.keystore "$MIN_VC"
          EXPECTED=16AD2626AC90F0B72DB78BF1DABDBD0FA85205D24FBD35D89F6B1A2E774D3386
          echo "::notice title=APK signing::package=ai.mobilerun.selfhosted versionCode=${VC:-?} SHA-256=$EXPECTED (matches phone 1.0.489)"
          {
            echo "## APK upgrade-safe"
            echo "- package: \`ai.mobilerun.selfhosted\`"
            echo "- versionCode: \`${VC:-}\` (must be > 489 on this branch)"
            echo "- signer SHA-256: \`$EXPECTED\` (android-app/debug.keystore / CN=Android Debug)"
          } >> "$GITHUB_STEP_SUMMARY"
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobilerun-apk
          path: android-app/build/outputs/apk/release/*.apk
          retention-days: 30

  # Fixed tag apk-386 for Mobilerun Keyboard Samsung subtype fix (this branch only)
  publish-apk-386:
    needs: android-build
    if: github.ref == 'refs/heads/cursor/ime-samsung-subtype-df3e' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: mobilerun-apk
          path: ./apk

      - name: Rename APK
        run: mv apk/*.apk apk/mobilerun.apk

      - name: Verify APK version is 386
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq aapt >/dev/null
          aapt dump badging apk/mobilerun.apk | tee /tmp/badging.txt
          grep -E "versionCode='386'" /tmp/badging.txt
          grep -E "versionName='1.0.386'" /tmp/badging.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install qrcode package
        run: npm install qrcode

      - name: Generate QR code
        run: |
          export APK_RELEASE_TAG=apk-386
          node scripts/generate-apk-qr.mjs
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_NUMBER: '386'
          APK_RELEASE_TAG: apk-386

      - name: Create / update apk-386 release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=apk-386
          REPO="${{ github.repository }}"
          NOTES="**Mobilerun Android App — apk-386 (IME Samsung fix)**

          Fixes Mobilerun Keyboard missing from Samsung One UI keyboard list:
          - \`method.xml\` subtypes (en_GB / en_US), settingsActivity, isDefault,
            supportsSwitchingToNextInputMethod
          - In-app **Enable keyboard** → ACTION_INPUT_METHOD_SETTINGS + IME picker
          - Agents still fall back to a11y SET_TEXT if IME is off

          ![Download QR Code](https://github.com/$REPO/releases/download/$TAG/apk-download-qr.png)

          **Links:**
          - [Commit ${{ github.sha }}](https://github.com/$REPO/commit/${{ github.sha }})
          - [Workflow run](https://github.com/$REPO/actions/runs/${{ github.run_id }})"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" apk/mobilerun.apk apk-download-qr.png --clobber
            gh release edit "$TAG" --title "Android Build 386 (IME Samsung fix)" --notes "$NOTES" --latest
          else
            gh release create "$TAG" \
              --title "Android Build 386 (IME Samsung fix)" \
              --notes "$NOTES" \
              --latest \
              apk/mobilerun.apk \
              apk-download-qr.png
          fi

      - name: Update README with latest APK
        run: node scripts/update-readme-apk.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_NUMBER: '386'
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}

      - name: Commit updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: update latest APK links [skip ci]"
            git push
          fi

      - name: Summary
        run: |
          echo "## apk-386 published" >> $GITHUB_STEP_SUMMARY
          echo "- [mobilerun.apk](https://github.com/${{ github.repository }}/releases/download/apk-386/mobilerun.apk)" >> $GITHUB_STEP_SUMMARY

  publish-apk:
    needs: android-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: mobilerun-apk
          path: ./apk
      
      - name: Rename APK
        run: |
          mv apk/*.apk apk/mobilerun.apk
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install qrcode package
        run: npm install qrcode
      
      - name: Generate QR code
        run: node scripts/generate-apk-qr.mjs
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
      
      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="apk-${{ github.run_number }}"
          REPO="${{ github.repository }}"
          
          gh release create "$TAG" \
            --title "Android Build ${{ github.run_number }}" \
            --notes "**Mobilerun Android App - Build ${{ github.run_number }}**
          
          Scan the QR code below or download the APK directly.
          
          ![Download QR Code](https://github.com/$REPO/releases/download/$TAG/apk-download-qr.png)
          
          **Installation:**
          1. Download the APK on your Android device
          2. Enable \"Install from unknown sources\" in Settings
          3. Open the downloaded APK to install
          4. If you see Play Protect warning, tap \"More details\" then \"Install anyway\"
          
          **Note:** New builds will update in place (same signing key).
          
          **Links:**
          - [Commit ${{ github.sha }}](https://github.com/$REPO/commit/${{ github.sha }})
          - [Workflow run](https://github.com/$REPO/actions/runs/${{ github.run_id }})" \
            --latest \
            apk/mobilerun.apk \
            apk-download-qr.png
      
      - name: Update README with latest APK
        run: node scripts/update-readme-apk.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
      
      - name: Commit updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: update latest APK links [skip ci]"
            git push
          fi
      
      - name: Add summary to workflow
        run: |
          TAG="apk-${{ github.run_number }}"
          REPO="${{ github.repository }}"
          echo "## ✅ APK Published Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** 1.0.${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Download:**" >> $GITHUB_STEP_SUMMARY
          echo "- [mobilerun.apk](https://github.com/$REPO/releases/download/$TAG/mobilerun.apk)" >> $GITHUB_STEP_SUMMARY
          echo "- [QR Code](https://github.com/$REPO/releases/download/$TAG/apk-download-qr.png)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "![QR Code](https://github.com/$REPO/releases/download/$TAG/apk-download-qr.png)" >> $GITHUB_STEP_SUMMARY
      
      - name: Upload QR code artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-qr-code
          path: apk-download-qr.png
          retention-days: 90

  # Prerelease APK + QR for feature branches (after green build) — does not touch main/latest
  # Enabled for MacMobileRun final-release branch only (preview; never marks latest).
  publish-apk-prerelease:
    needs: android-build
    if: github.ref == 'refs/heads/cursor/macmobilerun-final-df3e' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: mobilerun-apk
          path: ./apk

      - name: Rename APK
        run: mv apk/*.apk apk/mobilerun.apk

      - name: Verify preview APK version + signing (upgrade over 489)
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq aapt >/dev/null
          python3 scripts/verify_apk_upgrade.py apk/mobilerun.apk android-app/debug.keystore 490
          VC=$(aapt dump badging apk/mobilerun.apk | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
          VN=$(aapt dump badging apk/mobilerun.apk | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)
          echo "VC=$VC" >> "$GITHUB_ENV"
          echo "VN=$VN" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install qrcode package
        run: npm install qrcode

      - name: Generate QR code
        run: |
          # Point QR at the prerelease tag URL (use verified versionCode, not raw run_number if floored)
          TAG_VC="${VC:-${{ github.run_number }}}"
          export APK_RELEASE_TAG="apk-preview-$TAG_VC"
          node scripts/generate-apk-qr.mjs
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          APK_RELEASE_TAG: apk-preview-${{ github.run_number }}

      - name: Create prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_VC="${VC:-${{ github.run_number }}}"
          TAG="apk-preview-$TAG_VC"
          REPO="${{ github.repository }}"
          BRANCH="${GITHUB_REF#refs/heads/}"
          gh release create "$TAG" \
            --prerelease \
            --title "APK Preview $TAG_VC ($BRANCH)" \
            --notes "**Mobilerun APK preview (prerelease)**

          Branch: \`$BRANCH\`
          Commit: ${{ github.sha }}
          versionCode: $TAG_VC / versionName: ${VN:-1.0.$TAG_VC}
          package: \`ai.mobilerun.selfhosted\`
          signer SHA-256: \`16AD2626AC90F0B72DB78BF1DABDBD0FA85205D24FBD35D89F6B1A2E774D3386\`
          (matches phone 1.0.489 — upgrades in place)

          ![Download QR Code](https://github.com/$REPO/releases/download/$TAG/apk-download-qr.png)

          - [mobilerun.apk](https://github.com/$REPO/releases/download/$TAG/mobilerun.apk)
          - [Workflow](https://github.com/$REPO/actions/runs/${{ github.run_id }})

          Safety + humanizer preview — not marked latest." \
            apk/mobilerun.apk \
            apk-download-qr.png

      - name: Upload QR artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-preview-qr
          path: apk-download-qr.png
          retention-days: 30

      - name: Summary
        run: |
          TAG="apk-preview-${{ github.run_number }}"
          REPO="${{ github.repository }}"
          echo "## APK prerelease" >> $GITHUB_STEP_SUMMARY
          echo "- [mobilerun.apk](https://github.com/$REPO/releases/download/$TAG/mobilerun.apk)" >> $GITHUB_STEP_SUMMARY
          echo "- [QR](https://github.com/$REPO/releases/download/$TAG/apk-download-qr.png)" >> $GITHUB_STEP_SUMMARY
