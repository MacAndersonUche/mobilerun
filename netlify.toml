# Site settings (also set in Netlify UI):
# - base directory: frontend
# - publish: dist (relative to base → frontend/dist)
# - NODE_VERSION: 20
[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
