# Site settings (also set in Netlify UI):
# - base directory: frontend
# - publish: dist (relative to base → frontend/dist)
# - NODE_VERSION: 20
[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
  # Cloud backend (eu-west-2). Override in Netlify UI if the API URL changes.
  VITE_API_URL = "https://68tgk4z5n6.execute-api.eu-west-2.amazonaws.com"
  VITE_BACKEND_URL = "https://68tgk4z5n6.execute-api.eu-west-2.amazonaws.com"
  VITE_WS_URL = "wss://sv7144gijj.execute-api.eu-west-2.amazonaws.com/prod"
  # Cognito (set real values in Netlify UI for Hosted UI + Google):
  # VITE_COGNITO_DOMAIN = your-prefix.auth.eu-west-2.amazoncognito.com
  # VITE_COGNITO_CLIENT_ID = ...
  # VITE_COGNITO_REDIRECT_URI = https://<site>/auth/callback

# Hide Netlify's edge-injected "Powered by Netlify" badge. That script runs in
# an iframe and needs 'unsafe-inline' in script-src; omitting it blocks the
# badge without touching our module scripts (see Netlify docs). Also turn the
# badge off under Project configuration → General → Powered by Netlify badge
# when the plan allows — CSP is the code-side guarantee.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; worker-src 'self' blob:; form-action 'self' https:; frame-src 'self' https://*.amazoncognito.com"
